<!DOCTYPE html>
<html lang="pt-br">

<head>
    <!-- Permite utilizar acentos e caracteres especiais -->
    <meta charset="UTF-8">

    <!-- Adapta a página para diferentes tamanhos de tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título da aba do navegador -->
    <title>Área do Círculo</title>

    <!-- Conecta o HTML ao CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Div que agrupa os elementos da calculadora -->
    <div class="calculadora">

        <!-- Título principal -->
        <h1>Área do Círculo</h1>

        <!-- Texto explicativo -->
        <p>Digite o raio para calcular a área:</p>

        <!-- Campo para digitar o raio -->
        <input type="number" id="raio" placeholder="Digite o raio" min="0" step="any">

        <!-- Botão que executa a função JavaScript -->
        <button onclick="calcularArea()">Calcular área</button>

        <!-- Parágrafo onde aparecerá o resultado -->
        <p id="resultado"></p>

    </div>

    <!-- Conecta o HTML ao JavaScript -->
    <script src="calculo..js"></script>

</body>

</html>
